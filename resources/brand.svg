<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- `// +`, the start of every controller-gen marker. Round-capped strokes on transparent, like
       the MCP Config Manager icon, in a neutral grey that shows on dark and light backgrounds.
       Paths only, so no fonts are needed. -->
  <g fill="none" stroke="#808080" stroke-width="13" stroke-linecap="round">
    <line x1="10" y1="96" x2="32" y2="32"/>
    <line x1="38" y1="96" x2="60" y2="32"/>
    <line x1="96" y1="40" x2="96" y2="88"/>
    <line x1="72" y1="64" x2="120" y2="64"/>
  </g>
</svg>
